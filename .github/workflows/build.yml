name: Build GNAT-LLVM Toolchain

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout GNAT-LLVM
        uses: actions/checkout@v4
        with:
          repository: adacore/gnat-llvm
          ref: 3d596322e94eb1f2cf749caffed2eb952aef9bfa
          path: gnat-llvm

      - name: Checkout GCC 14
        uses: actions/checkout@v4
        with:
          repository: gcc-mirror/gcc
          ref: releases/gcc-14
          path: gnat-llvm/llvm-interface/gcc

      - name: Create gnat_src symlink
        run: ln -s gcc/gcc/ada gnat-llvm/llvm-interface/gnat_src

      - name: Apply patch
        run: |
          mkdir -p gnat-llvm/llvm/patches
          wget -q -P gnat-llvm/llvm/patches https://raw.githubusercontent.com/godunko/adawebpack/refs/heads/master/patches/llvm_wrapper2.patch
          patch -d gnat-llvm/llvm-interface -i ../llvm/patches/llvm_wrapper2.patch

      - name: Setup Alire toolchain
        uses: alire-project/setup-alire@v3
        with:
          toolchain: gnat_native^14 gprbuild

      - name: Install LLVM 16 and tools
        run: |
          sudo apt update
          sudo apt install -y llvm-16-dev clang-16 libclang-16-dev llvm-16 llvm-16-tools
          # Locate the real LLVM binary directory
          LLVM_BIN_DIR=$(find /usr -type d -name "llvm-16" 2>/dev/null | head -1)
          if [ -z "$LLVM_BIN_DIR" ]; then
            echo "Cannot find llvm-16 directory"
            exit 1
          fi
          echo "$LLVM_BIN_DIR" >> $GITHUB_PATH
          # Install all versioned tools as unversioned symlinks
          for tool in $LLVM_BIN_DIR/*-16; do
            toolname=$(basename "$tool" -16)
            sudo ln -sf "$tool" "/usr/local/bin/$toolname" 2>/dev/null || true
          done
          # Also handle tools that might be directly in /usr/bin with -16 suffix
          for tool in /usr/bin/*-16; do
            toolname=$(basename "$tool" -16)
            if [ ! -f "/usr/local/bin/$toolname" ]; then
              sudo ln -sf "$tool" "/usr/local/bin/$toolname" 2>/dev/null || true
            fi
          done
          # Ensure llvm-config is up to date
          sudo update-alternatives --install /usr/local/bin/llvm-config llvm-config /usr/bin/llvm-config-16 100 2>/dev/null || true

      - name: Build compiler
        run: |
          export PATH=$(echo ~/.local/share/alire/toolchains/gnat_native*/bin):$PATH
          export PATH=$(echo ~/.local/share/alire/toolchains/gprbuild*/bin):$PATH
          make -C gnat-llvm

      - name: Build runtime library
        run: |
          export PATH="/usr/local/bin:$PATH"
          export PATH=$(echo ~/.local/share/alire/toolchains/gnat_native*/bin):$PATH
          export PATH=$(echo ~/.local/share/alire/toolchains/gprbuild*/bin):$PATH
          export PATH="$PWD/gnat-llvm/llvm-interface/bin:$PATH"
          make -C gnat-llvm gnatlib-bc

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gnat-llvm-toolchain
          path: |
            gnat-llvm/llvm-interface/bin/*
            gnat-llvm/llvm-interface/adalib/*.bc
            gnat-llvm/llvm-interface/adalib/*.a
            gnat-llvm/llvm-interface/lib/*
