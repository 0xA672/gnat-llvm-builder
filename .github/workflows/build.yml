name: Build GNAT-LLVM Toolchain

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout GNAT-LLVM
        uses: actions/checkout@v4
        with:
          repository: adacore/gnat-llvm
          ref: 3d596322e94eb1f2cf749caffed2eb952aef9bfa
          path: gnat-llvm

      - name: Checkout GCC 14
        uses: actions/checkout@v4
        with:
          repository: gcc-mirror/gcc
          ref: releases/gcc-14
          path: gnat-llvm/llvm-interface/gcc

      - name: Create gnat_src symlink
        run: ln -s gcc/gcc/ada gnat-llvm/llvm-interface/gnat_src

      - name: Apply patch
        run: |
          mkdir -p gnat-llvm/llvm/patches
          wget -q -P gnat-llvm/llvm/patches https://raw.githubusercontent.com/godunko/adawebpack/refs/heads/master/patches/llvm_wrapper2.patch
          patch -d gnat-llvm/llvm-interface -i ../llvm/patches/llvm_wrapper2.patch

      - name: Setup Alire toolchain
        uses: alire-project/setup-alire@v3
        with:
          toolchain: gnat_native^14 gprbuild

      - name: Download and setup LLVM 16 prebuilt
        run: |
          wget -nv https://github.com/llvm/llvm-project/releases/download/llvmorg-16.0.6/clang+llvm-16.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz
          mkdir -p llvm-prebuilt
          tar xf clang+llvm-16.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz -C llvm-prebuilt --strip-components=1
          echo "$PWD/llvm-prebuilt/bin" >> $GITHUB_PATH
          echo "LLVM_CONFIG=$PWD/llvm-prebuilt/bin/llvm-config" >> $GITHUB_ENV

      - name: Build compiler
        run: |
          export PATH="$PWD/llvm-prebuilt/bin:$PATH"
          export PATH=$(echo ~/.local/share/alire/toolchains/gnat_native*/bin):$PATH
          export PATH=$(echo ~/.local/share/alire/toolchains/gprbuild*/bin):$PATH
          make -C gnat-llvm

      - name: Build runtime library
        run: |
          export PATH="$PWD/llvm-prebuilt/bin:$PATH"
          export PATH=$(echo ~/.local/share/alire/toolchains/gnat_native*/bin):$PATH
          export PATH=$(echo ~/.local/share/alire/toolchains/gprbuild*/bin):$PATH
          export PATH="$PWD/gnat-llvm/llvm-interface/bin:$PATH"
          make -C gnat-llvm gnatlib-bc

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gnat-llvm-toolchain
          path: |
            gnat-llvm/llvm-interface/bin/*
            gnat-llvm/llvm-interface/adalib/*.bc
            gnat-llvm/llvm-interface/adalib/*.a
            gnat-llvm/llvm-interface/lib/*
